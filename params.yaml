# Settings of the MLOps platform. Paths are the ones inside the containers (see docker-compose.yml: volumes).
# Secrets (database password, W&B key, GitHub token, login of the app) are in .env, never here.

paths:
  data: /data            # volume mlops-data: pages/ (the dataset), augmented/, uploads/, work/
  runs: /runs            # volume mlops-runs: one folder per job (exported model, ketos reports)
  release: /release      # volume mlops-release: the clone of MaDoc used to open pull requests

device: cuda:0           # kraken / ketos device of the worker
seed: 42                 # ketos -s: the same data and seed give the same training (as far as the GPU allows)

wandb:
  entity: arabic-htr
  project: {blla: kraken-blla, htr: kraken-htr}
  eval_project: {blla: kraken-blla-eval, htr: kraken-htr-eval}
  artifact: {blla: kraken-blla-bc, htr: kraken-htr-bc}     # one collection per task: v0, v1 ...

ingest:
  min_lines: 5                 # a page with fewer text lines is rejected
  min_text_ratio: 0.9          # share of the lines that must be transcribed
  max_upload_mb: 2048          # a larger zip is refused
  # split by GROUP: pages that look alike (same register, same year) always land in the same split, so the test
  # pages are not near-copies of train pages. The group is the first capture of this pattern on the original
  # file name ("03010108_1_1_I_2016_162-2-1" -> "03010108_1_1_I_2016": commune, register, year); a name that
  # does not match is its own group. null: every page is its own group (split by page).
  group_pattern: '^(.+?_\d{4})_'
  # the page type: the first capture on the original file name, "<register>_<year>_<act>-<page>-<n>":
  # "03010108_1_1_I_2004_1-1-1" -> "1": page 1 of the act (names of the child and the parents, in Arabic and
  # French, sometimes notes); "03010108_1_1_I_2004_1-2-1" -> "2": page 2 (the details).
  # The two pages of an act share their register and year, so their group: same split, no leak of the names.
  page_type_pattern: '-(\d+)-\d+$'
  page_types: {"1": "page 1 (names)", "2": "page 2 (details)"}
  # characters replaced in the transcriptions, at ingest and by "python -m mlops.cli normalize" (pages already in):
  # invisible or look-alike characters the model cannot tell apart in the image. "" deletes the character.
  normalize:
    "U+00A0": " "                # no-break space
    "U+202F": " "                # narrow no-break space
    "U+2009": " "                # thin space
    "U+200B": ""                 # zero-width space
    "U+FEFF": ""                 # zero-width no-break space (byte order mark)
    "U+200E": ""                 # left-to-right mark
    "U+200F": ""                 # right-to-left mark
    # "U+0640": ""               # Arabic tatweel (kashida): only if MaDoc's transcriptions never keep it
  # the groups are placed to balance the CHARACTERS (mlops/splitting.py): val_fraction / test_fraction of all the
  # characters, every character in train, val and test when the groups allow it, the same character distribution
  # in every split. A split may differ from its share by split_tolerance of it (0.33: 15 % -> 10 % to 20 %).
  val_fraction: 0.15
  test_fraction: 0.15
  split_tolerance: 0.33
  # second priority of the split (after the tolerance, an empty split, a page type missing from a split):
  # - missing_character: cost of a character of the dataset missing from a split (x3 when missing from train);
  # - page_types: cost of a split being 1.0 away (relative) from its share of the pages of a type (test holding
  #   30 % of the page 2 instead of 15 %). Page 2 weighs most: MaDoc extracts and structures its text, the
  #   evaluation must hold its fair share of them.
  split_weights:
    missing_character: 2000
    page_types: {"1": 2000, "2": 3000}

ui:
  rare_characters: 50          # Data tab, vocabulary: a character seen fewer times is shown in red

augment:
  enabled: true                # the train pages only, never val / test (Data tab: "Augment the train pages")
  copies: 1                    # the defaults of the Data tab and of a training that finds no augmentation
  seed: 42

blla:
  epochs: -1                   # until early stopping (--quit early, after `lag` epochs without a better val_mean_iu)
  lag: 5
  resize: union
  # fine-tuning a model that is already good: a smaller learning rate than kraken's 2e-4, decreasing over 30 epochs
  extra_args: ["-r", "5e-5", "--schedule", "cosine", "--cos-max", "30"]
  use_augmented: false         # default of the "use augmented pages" box of the Train tab

htr:
  epochs: -1
  batch_size: 30
  lag: 20
  resize: new
  extra_args: []
  use_augmented: true          # default of the "use augmented pages" box of the Train tab

# a candidate is better when it wins on the SAME test pages (old + new), with a confidence interval computed by
# resampling the pages (bootstrap): a gain that could be noise does not pass.
gate:
  bootstrap_samples: 2000
  confidence: 0.95
  htr:
    metric: page_cer           # character error rate of each test page, with the true lines (lower is better)
    min_gain: 0.0              # the lower bound of the CI of (production - candidate) must be above this
    max_old_drop: 0.2          # and on the pages the production model was evaluated on: at most +0.2 point of CER
  blla:
    metric: e2e_word_f1        # segmentation + production HTR on each test image: words found (higher is better)
    min_gain: 0.0
    max_old_drop: 0.01

release:
  github_repo: NiemaAM/MaDoc
  branch: master
  models: {blla: models/blla.mlmodel, htr: models/htr.mlmodel}
  card: models/MODEL_CARD.json

gpu:
  # the Ollama models of MaDoc unloaded before a job (the GPU is shared): Ollama reloads them at their next use
  ollama_url: http://madoc-ollama:11434
  unload_models: ["gemma3:12b"]